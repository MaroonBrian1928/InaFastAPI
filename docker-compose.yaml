services:
  ina-segmenter:
    build: .
    ports:
      - "8002:8000"
    volumes:
      # inaSpeechSegmenter downloads its model weights here on first use.
      - keras-cache:/root/.keras
    restart: unless-stopped
    healthcheck:
      # No dedicated health route; FastAPI's schema endpoint answers once the app is up.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  keras-cache:
